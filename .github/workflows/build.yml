name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unzip newest project zip
        run: |
          ZIP=$(ls *.zip | sort -V | tail -n 1)
          echo "Building from $ZIP"
          unzip -q -o "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK pieces
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: LiquidGlass-ControlCenter
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlassControlCenter-apk
          path: LiquidGlass-ControlCenter/app/build/outputs/apk/release/*.apk
